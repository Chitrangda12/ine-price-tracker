name: Scheduled Scrape

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger scheduled scrape
        run: |
          curl --fail-with-body --request POST \
            --header "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            "https://ine-price-tracker-xtwx.onrender.com/api/cron/scrape"
